    <div class="film-box">
      <video class="film film--packed" id="film" poster="assets/poster_packed.jpg" width="1920" height="1416" muted playsinline loop preload="auto" aria-label="A white 4x4 with longboards parked on the beach at sunset while two surfers walk to the sea"></video>

    </div>

      <span class="hl" style="left:493px; top:331px; width:958.72px" aria-hidden="true">SURFING</span>

your
first wave</p>

      <div class="pin pin--tr" data-ax="1870" data-ay="31">
